name: Deploy Developmeh.com
run-name: ${{ github.actor }} will build and deploy the site 🚀
on:
  push:
    branches: [ "main" ]

permissions:
  contents: write
  pages: write
  id-token: write
  discussions: write

jobs:
  Build-with-Nix:
    runs-on: ubuntu-latest
    steps:
      - run: echo "🎉 The job was automatically triggered by a ${{ github.event_name }} event."
      - run: echo "🐧 This job is now running on a ${{ runner.os }} server hosted by GitHub!"
      - run: echo "🔎 The name of your branch is ${{ github.ref }} and your repository is ${{ github.repository }}."
      - name: Check out repository code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      # - name: setup theme
      #   run: git subtree add --prefix themes/zola_easydocs_theme git@github.com:developmeh/zola_easydocs_theme.git master --squash
      - name: Install Nix
        uses: cachix/install-nix-action@v31.9.0
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Sync GitHub Discussions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          USE_ORG_DISCUSSIONS: "true"
        run: |
          nix develop --command bash -c '
            chmod +x .scripts/sync_discussions.sh
            ./.scripts/sync_discussions.sh
          '
      - name: Commit discussion metadata and data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/**/*.md data/
          if git diff --staged --quiet; then
            echo "No discussion changes to commit"
          else
            git commit -m "chore: update discussion metadata and data [skip ci]"
            git push
          fi
      - name: Build release
        run: nix develop ./deploy --command zola build --output-dir ./_site
      - name: Verify discoverability layer
        # Asserts the machine-readable layer answer engines depend on: the
        # Person entity with its sameAs/knowsAbout/memberOf, articles
        # referencing it by @id, article typing, FAQPage on pillars, llms.txt,
        # robots.txt crawler entries, sitemap topic coverage, topic chips
        # resolving, and DOM order. Runs before upload so a broken entity graph
        # fails the deploy instead of shipping.
        env:
          SITE: ./_site
        run: nix develop ./deploy --command bats tests/discoverability.bats
      - run: echo "🍏 This job's status is ${{ job.status }}."
      - name: Upload artifact
        # Automatically uploads an artifact from the './_site' directory by default
        uses: actions/upload-pages-artifact@v3
  Deploy-Pages:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: Build-with-Nix
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Notify IndexNow
        # Bing and Yandex accept push submission; Google does not participate
        # and retired its sitemap ping in 2023. Reads the LIVE sitemap, so it
        # can only submit URLs that are actually published. Best-effort by
        # design: it never fails a deploy that has already succeeded.
        env:
          INDEXNOW_KEY: 914c94d67f890941f28055c2e000476d
        run: |
          curl -fsSL -o /tmp/indexnow.sh \
            https://raw.githubusercontent.com/${{ github.repository }}/main/.scripts/indexnow.sh
          chmod +x /tmp/indexnow.sh
          /tmp/indexnow.sh
