# Example GitHub Actions workflow for lean-browser (plan §8 M0 / §9).
#
# This file is NOT under .github/ on purpose: the repository's real
# .github/workflows/deploy.yml deploys the Zola blog, and lean-browser lives
# in a subdirectory of that repository. To enable it, copy this file to
# .github/workflows/lean-browser.yml (paths below assume the subdirectory).
#
# Jobs:
#   check    - `nix flake check` on the flake-parts module: clippy -D warnings,
#              cargo test, rustfmt, and the crane package build (nix/checks.nix).
#   measure  - builds the release binaries, runs lean-measure on the corpus
#              (headless; no display server is needed because the renderer's
#              --serve mode paints PNGs), diffs against the committed Chromium
#              references in refs/, uploads report.json + PNGs as an artifact
#              and posts the Markdown table as the job summary. `--gate` fails
#              the job when a plan §8 gate regresses.
#   refs     - (manual) regenerates refs/ with the pinned Playwright Chromium
#              so a reviewer can commit them with the change that needs them.
name: lean-browser

on:
  push:
    branches: [main]
    paths: ['lean-browser/**']
  pull_request:
    paths: ['lean-browser/**']
  workflow_dispatch:
    inputs:
      refs:
        description: 'Regenerate Chromium references'
        type: boolean
        default: false

defaults:
  run:
    working-directory: lean-browser

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
      - uses: DeterminateSystems/magic-nix-cache-action@v9
      # The first run creates flake.lock (none is committed yet, see STATUS.md);
      # commit it once it exists so builds are reproducible.
      - run: nix flake check --print-build-logs

  measure:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
      - uses: DeterminateSystems/magic-nix-cache-action@v9
      - name: Fonts the corpus pins (DejaVu) for the renderer
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
      - name: Build release binaries
        run: nix develop --command cargo build --release --workspace
      - name: Measure the corpus
        # 10 samples over 5 s after the last paint per page (plan §9).
        run: |
          nix develop --command ./target/release/lean-measure \
            --corpus corpus --refs refs --out target/measure \
            --samples 10 --settle-ms 5000 \
            --font-dir /usr/share/fonts/truetype/dejavu \
            --gate
      - name: Job summary
        if: always()
        run: cat target/measure/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lean-measure-report
          path: |
            lean-browser/target/measure/report.json
            lean-browser/target/measure/report.md
            lean-browser/target/measure/*.png

  refs:
    if: github.event_name == 'workflow_dispatch' && inputs.refs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pinned Playwright Chromium (see refs/VERSION)
        run: |
          sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Regenerate references
        run: NODE_PATH=$PWD/node_modules node corpus/tools/make-refs.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: chromium-refs
          path: lean-browser/refs/
