# Commit Agent - Gate, Verification & Robot Commit
#
# Receives doc-organizer output, runs gate.sh (zola build + internal link audit
# + discoverability suite), commits as DevelopmehPublishRobot on a green gate.
# Uses verify_script to ensure the commit author is correct.
#
# Usage:
#   kwike consume --config ./consumer.yaml

name: commit-agent

source:
  daemon: "unix://./.kwike/daemon.sock"
  types:
    - "publish.commit.done"        # Doc-organizer completed work

state:
  dir: ./state

uniform:
  path: ./uniform.md

llm:
  command: claude
  stdin: [prompt, spec]
  args:
    - "--print"
    - "--model"
    # haiku is sufficient because gate.sh makes the pass/fail decision. If this
    # agent starts mis-copying gate output into feedback or mangling the
    # contract, raise to sonnet rather than loosening the gate.
    - "haiku"
    - "--permission-mode"
    - "dontAsk"
    - "--allowedTools"
    - "Read"
    - "Bash(git diff *)"
    - "Bash(git log *)"
    # Widened from `git status` so `git status --porcelain` is permitted.
    - "Bash(git status*)"
    - "Bash(git add *)"
    - "Bash(git commit *)"
    # The gate. Without this the agent has no way to verify anything it claims
    # to verify, which was the state this workflow shipped in.
    - "Bash(.kwike/agents/commit-agent/gate.sh*)"
    - "--add-dir"
    - "${KWIKE_WORKING_DIR}"
  # Raised from 10m: a cold `zola build` plus the bats suite is slower than a
  # diff read, and a timeout mid-gate looks like a failure rather than a retry.
  timeout: 15m
  resume_flag: true
  schema: ./schema.json
  schema_max_retries: 3

flow:
  poll_interval: 5s
  inbox_size: 1
  max_concurrent: 1
  backoff:
    initial: 1s
    max: 30s
    multiplier: 2.0

lifecycle:
  emit_done: true
  emit_failed: true
  status_field: status
  status_mapping:
    approved: done               # publish.commit.review.done
    rejected: rejected           # publish.commit.review.rejected
  verify_script: ./verify.sh
  verify_max_retries: 2

session:
  resume_types:
    - "publish.commit.done"
  timeout: 2h
