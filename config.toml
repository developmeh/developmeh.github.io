developer-experience = "Making the tools and environments developers work in less hostile."
nix = "Reproducible, template-able development environments with Nix."
ci-cd = "Continuous integration, delivery, and why the first matters more."
shell-testing = "Testing bash and CLI tools with BATS and the Test Anything Protocol."
testing = "Automated testing practice, from unit assertions to integration harnesses."
software-architecture = "Decoupling, encapsulation, and the cost of complexity."
distributed-systems = "Building systems across processes and machines, usually by rebuilding them badly first."
event-streaming = "Append-only logs, consumer groups, and event-driven design."
webassembly = "WASM as a sandboxed execution substrate."
capability-security = "Running untrusted code without granting it the machine."
engineering-leadership = "Technical leadership, code ownership, and how teams actually work."
